name: verify-tags
# Clones the repo once per tag (segN-start, segN-done, workshop-v1) and runs: npm ci, doctor, typecheck, test.
on:
  workflow_dispatch:
  push:
    tags: ['seg*', 'workshop-v1']
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run verify-tags -- --source .
